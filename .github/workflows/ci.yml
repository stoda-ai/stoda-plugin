name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
      - run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq
      - run: npm install -g @anthropic-ai/claude-code@2.1.326
      - run: just test
      - name: plugin version went up
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version.sh "origin/$BASE_REF"

  # Whether this commit may be released (release-ready.sh): only a push to main whose commit passes the release gate
  # (RELEASE-HOLD absent, LICENSE complete). It runs on every pull request and push, with no `if`, so it is never
  # "skipped" (which a required check would count as passing); on a pull request it fails, so a PR's head commit never
  # carries a successful release-ready.
  #
  # CI never publishes: no job here can write to the repository. A repository admin releases a commit by hand with
  # scripts/promote.sh, which checks this workflow's push run on main for that exact commit first.
  release-ready:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/release-ready.sh HEAD
